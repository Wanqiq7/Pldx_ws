# Sentry 机器人 Nav2 参数配置
# 该文件主要针对本项目定制化的行为树、局部/全局规划 和基于 STVL 的 3D 点云障碍层配置。
# 这些参数直接决定导航轨迹、动态障碍补偿、目标跟踪和地图更新的效果。

bt_navigator:
  ros__parameters:
    # 是否使用真实 ROS 时钟；本配置使用离线/仿真模式时关闭。
    use_sim_time: False
    # 全局坐标系，导航目标通常在 map 坐标系中描述。
    global_frame: map
    # 机器人底盘基座标系，需与 TF 中的基座标系一致。
    robot_base_frame: "base_link_fake"
    # 用于估计里程计状态的主题。
    odom_topic: /aft_mapped_to_init
    # 行为树主循环频率，单位 ms。
    bt_loop_duration: 20 # ms
    # 行为树请求的默认超时时间，单位秒。
    default_server_timeout: 20
    # 等待服务响应的超时时间，单位 ms。
    wait_for_service_timeout: 2000
    plugin_lib_names: [minco_goal_updater_bt_node]
    # 默认导航生成行为树的 XML 文件，可由 launch 文件或 remap 覆盖。
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    default_nav_through_poses_bt_xml: $(find-pkg-share navi2)/behavior_tree/navigate_through_pose_w_replanning_and_recovery.xml
    default_nav_to_pose_bt_xml: $(find-pkg-share navi2)/behavior_tree/navigate_to_pose_w_replanning_and_recovery.xml

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    # 通过多个目标点进行导航时是否启用仿真时钟。
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    # 导航到单目标点时是否启用仿真时钟。
    use_sim_time: False

controller_server:
  ros__parameters:
    # 机器人底盘基座标系，必须和 TF 树对应。
    robot_base_frame: "base_link_fake"
    # 是否使用仿真时钟。
    use_sim_time: False
    # Nav2 的停车检查与 MPC 使用同一里程计；由 controller_odom_topic 一并 remap。
    odom_topic: /aft_mapped_to_init
    # 控制器执行频率，单位 Hz，越高越敏感。
    controller_frequency: 100.0
    # x 方向速度低于阈值时被视为停止，避免抖动带来误判。
    min_x_velocity_threshold: 0.01
    # y 方向速度阈值。差分机器人通常 y 方向约束较小。
    min_y_velocity_threshold: 0.01
    # 角速度阈值，用于判断接近目标时是否停止旋转。
    min_theta_velocity_threshold: 0.001
    # 控制器允许的失败容忍时间，超出后进行恢复或重试。
    failure_tolerance: 0.1
    # 进度检查器插件名称。
    progress_checker_plugin: "progress_checker"
    # 目标检查器列表；这里使用通用目标检查器。
    goal_checker_plugins: ["general_goal_checker"]
    # 当前启用的局部控制器插件，统一使用 FollowPath。
    controller_plugins: ["FollowPath"]

    # 进度检查器参数，用于判断机器人是否真正向目标前进。
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 规定的最小移动半径，如果没有超过该范围则认为未前进。
      required_movement_radius: 0.1
      # 在该时间内没有明显进展，则 FollowPath 失败并交给行为树恢复。
      # 必须长于一次内部恢复（fail_threshold 次失败 + cooldown_sec + recovery_window_sec ≈ 5 s）。
      # 确定性的规划失败由 MincoPlanner 的 FAILED 通知直接上报，这里只做兜底。
      movement_time_allowance: 10.0
    general_goal_checker:
      # 每次同时检查当前位置和停车速度，避免运动中短暂入圈便锁存成功。
      stateful: False
      plugin: "nav2_controller::StoppedGoalChecker"
      # XY 平面到点容差，单位 m；在定位坐标中检查。
      xy_goal_tolerance: 0.1
      # Yaw 角度误差容差，单位 rad，设置为 2π 表示允许任意角度到达时也判定为已到达。
      yaw_goal_tolerance: 6.28
      trans_stopped_velocity: 0.1
      rot_stopped_velocity: 0.1

    FollowPath:
      plugin: "minco_controller::MincoMpcController"
      # 独立失效保护（秒）：同时检查消息时间戳与稳态接收时间。
      reference_timeout_sec: 2.0
      odom_timeout_sec: 0.3
      # 是否启用小陀螺模式；该模式会压低旋转带宽并适合特定机器人。
      use_small_gyro_mode: false
      # 当速度低于该阈值时，认为车辆处于死区，减少抖动信号。
      deadzone_speed_threshold: 0.1
      # odom 时间戳到命令生效的时延，期间按上一次下发的加速度外推。
      control_delay_compensation: 0.05

      # 速度上下限（map 系），作为力控 MPC 的速度状态约束。
      vx_min: -3.0
      vx_max: 3.0
      vy_min: -3.0
      vy_max: 3.0
      fixed_wz: 4.18 # rad/s，开启 use_small_gyro_mode 时使用的固定角速度
      omega_min: -5.0
      omega_max: 5.0

      # 力控（动力学）MPC：状态 [p, yaw, v, omega]，输入 [Fx, Fy, Mz]，输出速度命令（可选力前馈）。
      # 加速度上限 min(mu·g, max_force/mass)。mass/inertia_z/friction_coeff/max_force 为占位值，
      # 实机需标定，并实测底盘速度环时间常数来设定 command_lookahead。
      dynamic:
        dt: 0.02
        lookahead_time: 0.8
        # 输出预测轨迹上 t0 + command_lookahead 处的速度，补偿下位机速度环与通信延迟。
        # 应接近底盘速度环等效时间常数：仿真底盘约 0.2 s，0.05 会导致到点超调；实车需重新测定。
        command_lookahead: 0.2
        # 二次参考：按预测速度与参考速度夹角余弦缩短时间步，牺牲纵向进度换横向精度。
        secondary_reference: false
        # 物理参数（占位值，需实车标定）：平移加速度上限 min(mu·g, max_force/mass)。
        mass: 25.0
        inertia_z: 1.0
        friction_coeff: 0.6
        max_force: 60.0
        max_torque: 5.0
        # 位置/速度权重按参考速度切向分解为沿轨迹与横向。
        q_pos_along: 5.0
        q_pos_cross: 40.0
        q_vel_along: 1.0
        q_vel_cross: 2.0
        q_yaw: 10.0
        q_omega: 0.5
        # 输入相对参考加速度（力前馈 m·a_ref）的偏差权重与相邻输入差分权重。
        r_acc: 0.05
        r_jerk: 0.002
        r_alpha: 0.02
        r_dalpha: 0.001
        # 坡道扰动 d 进入模型 v' = a + d，输出速度额外提前 command_lookahead·(-d)。
        # 重力项：按 odom 姿态计算坡面切向重力。底盘速度环自带积分时会重复补偿
        # （仿真中更差），默认关闭；阶段 3 力前馈时 wrench 已包含 -m·d。
        slope_gravity: false
        # body 相对底盘的固定安装横滚（rad）。仿真 body 水平取 0；实车需按安装标定，
        # 不要直接沿用 lidar_roll_offset（错的值会在平地产生恒定横向扰动）。
        gravity_body_roll_offset: 0.0
        # 扰动观测器：一阶滞后（时间常数 observer_lag，默认 = command_lookahead）加集总扰动的
        # Luenberger 观测器。仿真两轮结果不一致，默认关闭，实车需单独验证。
        disturbance_observer: false
        observer_bandwidth: 4.0
        observer_max_estimate: 1.0
        # 轮速融合（报告 5.5.5.4.1）：订阅底盘系速度 [vx, vy, wz]（TwistStamped），从 LIO 时间戳
        # 积分到当前时刻替代该段的固定延迟外推；数据缺失、中断或陈旧时退回 LIO。
        # 实车由 ros2_libxr 发布（MC02 chassis_feedback，需烧录含 0x32B 轮速帧的固件）；
        # 启用前用 scripts/check_chassis_velocity_frame.py 核对轴向与 wz 符号。
        # 仿真用 SIM_WHEEL_ODOM=1 ./start_sim.sh。
        wheel_odometry: false
        wheel_odometry_topic: /sentry/chassis_velocity
        wheel_odometry_max_gap: 0.05
        wheel_odometry_timeout: 0.05
        # 力前馈（阶段 3）：额外发布 /chassis_cmd_mpc（ros_interfaces/ChassisCommand），
        # 速度与 F_ff = gain·m·a_plan(t0+lookahead) 同一控制周期、同一坐标系（与 /cmd_vel_mpc
        # 相同，bridge 默认原样直通）。gain 从 0 逐步加大；速度提前量随之从 command_lookahead
        # 线性缩到 lookahead，避免速度 PID 与前馈重复提供同一加速度。
        # 固件 Omni 另有 ff_max_force_n / ff_max_torque_nm 限幅。yaw 力矩默认关闭：
        # 导航/小陀螺模式下固件自行决定 wz。
        force_ff:
          enable: false
          gain: 0.0
          lookahead: 0.02
          yaw: false
          max_force: 100.0
          max_torque: 10.0

      # 激光雷达外参参数，用于将传感器坐标系与机器人基坐标系对齐。
      lidar_offset_x: 0.0
      lidar_offset_y: -0.20
      lidar_roll_offset: 0.1745

      # 坐标系设置：里程计和地图参考坐标系。
      odom_frame: "camera_init"
      map_frame: "map"

      performance:
        # 是否开启性能诊断统计。
        enable: true
        # 是否打印运行性能信息。
        print_enable: true
        # 是否保存详细 CSV 日志。
        detailed_csv_enable: false
        # 是否打印里程计调试信息。
        odom_sub_debug_enable: false
        # MPC 详细性能 CSV 文件路径。
        mpc_csv_path: /tmp/mpc_perf_detailed.csv
        # 打印周期，单位秒。
        print_period_sec: 1.0
        # 每隔多少次 flush 一次 CSV。
        csv_flush_every_n: 30
        # 运行 ID，可用于区分多次任务实验。
        run_id: ""
        scenario: ""
        variant: ""

local_costmap:
  local_costmap:
    ros__parameters:
      # 局部代价地图更新频率，单位 Hz。
      update_frequency: 10.0
      # 局部代价地图发布频率，单位 Hz。
      publish_frequency: 10.0
      # 局部地图参考坐标系，通常使用 camera_init。
      global_frame: camera_init
      # 机器人基座标系。
      robot_base_frame: base_link_fake
      use_sim_time: False
      # 使用滚动窗口，便于局部导航保留周围环境的最新信息。
      rolling_window: true
      # 局部地图长宽尺寸，单位 m。
      width: 5
      height: 5
      # 局部网格分辨率，单位 m/cell。
      resolution: 0.05
      # 机器人半径，影响碰撞检测和膨胀范围。
      robot_radius: 0.2
      # 代价地图层顺序：静态地图 + 时空体素层 + 膨胀层。
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.25
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        # 是否开启 STVL 动态障碍层。
        enabled: true
        # 体素衰减速率，影响障碍随时间消失的速度。
        voxel_decay: 0.6
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 5
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: true
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: mid360
        mid360:
          data_type: PointCloud2
          # 订阅的点云话题，过滤后的注册点云。
          topic: /cloud_registered_filtered
          marking: true
          clearing: true
          obstacle_range: 8.0
          min_obstacle_height: -0.1
          max_obstacle_height: 1.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true

          # 视锥模型参数，用于根据传感器视野更新代价地图
          max_z: 10.0 # 清除距离
          min_z: 0.1
          vertical_fov_angle: 1.03   # 3D 激光雷达对称视场角，单位 rad
          vertical_fov_offset: 0.3927  # 平面轴偏移，MID360 常用 +22.5°
          vertical_fov_padding: 0.05   # 额外伪装/容差，允许边缘不精确
          horizontal_fov_angle: 6.29   # 全向 360° 扫描覆盖角
          decay_acceleration: 15.0
          model_type: 1
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # 全局代价地图更新频率。
      update_frequency: 10.0
      # 全局代价地图发布频率。
      publish_frequency: 10.0
      # 全局坐标系。地图和路径规划会基于此坐标系工作。
      global_frame: map
      # 机器人基座标系。
      robot_base_frame: base_link_fake
      use_sim_time: False
      robot_radius: 0.20
      # 代价地图栅格分辨率。
      resolution: 0.05
      track_unknown_space: true
      # 使用静态层 + STVL 层 + 膨胀层构建全局代价地图。
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.80
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 1.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 5
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.2
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: mid360
        mid360:
          data_type: PointCloud2
          topic: /cloud_registered
          sensor_frame: body
          marking: true
          clearing: true
          obstacle_range: 8.0
          min_obstacle_height: 0.1
          max_obstacle_height: 0.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true

          # 视锥模型参数，用于根据传感器视野更新 STVL 层
          max_z: 10.0 # 清除距离
          min_z: 0.1
          vertical_fov_angle: 1.03   # 3D 激光雷达对称视场角
          vertical_fov_offset: 0.3927  # MID360 常用 22.5° 偏移
          vertical_fov_padding: 0.05   # 视场内额外安全余量
          horizontal_fov_angle: 6.29   # 360° 水平视野
          decay_acceleration: 15.0
          model_type: 1
      always_send_full_costmap: True

map_server:
  ros__parameters:
    # 是否使用仿真时钟。
    use_sim_time: False
    # 由 launch 文件提供地图路径，通常是 .yaml 描述文件。
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: "src/navigation/navi2_bringup/maps/2026/output.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    # 保存地图等待时间，单位秒。
    save_map_timeout: 5.0
    # 地图保存时自由栅格阈值。
    free_thresh_default: 0.25
    # 地图保存时占用栅格阈值。
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # 规划器期望更新频率，单位 Hz。
    expected_planner_frequency: 20.0
    use_sim_time: False
    # 当前启用的规划器插件，使用自定义 MincoPlanner。
    planner_plugins: ["MincoPlanner"]

    MincoPlanner:
      plugin: "minco_planner/MincoPlanner"
      scheduling:
        # 搜索、优化、校验及采样共享单次工作线程预算；安全检查超时撤销参考。
        # rmuc_2025 长路径搜索约 90 ms，复杂局部优化可超过 200 ms。
        control_budget_sec: 0.005
        planning_budget_sec: 0.5
        safety_budget_sec: 0.005
        # 同一目标版本、同一搜索模式失败（超时/不可行/不安全）后的重试冷却；0 表示关闭。
        # 50 ms 与 FSM 周期一致，GENERATE_TRAJ 连续 INFEASIBLE 仍按原节奏累计恢复失败次数。
        failure_cooldown_sec: 0.05
      # 当前规划模式，PRIORMAP 表示使用先验地图作为主约束。
      planner_mode: PRIORMAP
      # planner_mode: EXPLORATION
      frames:
        # 全局地图参考系。
        map_frame: map
        # 机器人局部/ROI 参考系。
        rog_frame: camera_init
      priormap:
        # 是否启用 Nav2 全局搜索与目标树融合。
        use_nav2_global_search: true
        # 是否将种子路径裁剪到 ROG 边界内，减少越界规划。
        clip_seed_by_rog_boundary: true
        # ROG 边界裁剪的安全距离，单位 m。
        rog_boundary_margin: 0.2
        # ROG 边界的采样步长，影响候选点密度。
        rog_boundary_sample_step: 0.1
      exploration:
        # 探索模式的边界外扩距离。
        boundary_margin: 0.2
        boundary_sample_step: 0.1
        # 是否把 unknown 视为占用，影响探索路径约束。
        unknown_as_occupied: true
        # 是否优先朝目标方向扩展路径？
        prefer_goal_direction: true
      # 路径终点容差，单位 m。
      tolerance: 0.3
      # 是否使用 SMAC 规划器以提高全局搜索质量。
      use_smac: true
      # 是否允许规划穿越未知区域。
      allow_unknown: false
      # 里程计话题，用于获取当前状态。
      odom_topic: /aft_mapped_to_init
      # 传感器与机器人基座之间的横向偏移
      lidar_offset_x: 0.0
      lidar_offset_y: -0.20
      performance:
        # 是否开启规划性能统计。
        enable: false
        # 是否打印规划器性能日志。
        print_enable: false
        # 是否保存详细 CSV 分析。
        detailed_csv_enable: false
        # 是否调试里程计输入。
        odom_sub_debug_enable: false
        minco_csv_path: /tmp/minco_perf_detailed.csv
        print_period_sec: 1.0
        csv_flush_every_n: 30
        run_id: ""
        scenario: ""
        variant: ""
      rog_map:
        # ROG 地图的参考帧。
        frame_id: camera_init
        # ROG 地图分辨率，单位 m/cell。
        resolution: 0.05
        # 三维膨胀地图分辨率，通常与 resolution 一致。
        inflation_resolution: 0.05
        # 地图大小 [x, y, z]，单位 m。
        map_size: [10.0, 10.0, 1.5]
        # 地图原点偏移，用于校正局部地图原点。
        fix_map_origin: [0.0, 0.0, 0.0]

        map_sliding:
          # 是否允许地图滑动跟踪机器人平移。
          enable: true
          # 触发地图滑动的位移阈值，单位 m。
          threshold: 0.2
          center_offset_enable: true
          center_offset: [0.0, 0.20, 0.0]

        ros_callback:
          # 是否通过 ROS 主题更新地图。
          enable: true
          cloud_topic: /cloud_registered_full
          odom_topic: /aft_mapped_to_init
          # 里程计超时阈值，单位 s。
          odom_timeout: 2.0
          update_period_ms: 20

        # 点云区域滤波，过滤掉进入特定范围的点，减少无意义数据。
        cloud_filter:
          enable: false
          z_offset: -1.0
          position_frame: map
          filter_mode: transform_center   # transform_cloud | transform_center
          remove_inside: true             # true: 删除框内点，false: 仅保留框内点
          log_stats: false
          stats_log_period_ms: 1000        # 0: 每帧输出
          publish_visualization: true
          visualization_topic: /cloud_registered_crop_filter/markers
          visualization_period_ms: 200     # 0: 每帧发布
          z_plane_size: 10.0
          z_plane_thickness: 0.03
          box_padding: 0.1
          position:
            x: 0.0
            y: 0.0
            z: 0.0
          box_size:
            x: 12.0
            y: 6.0
            z: 3.5
          positions:
            x: [15.6, 19.3, 13.4, 9.9]
            y: [1.55, 12.9, 13.45, 2.1]
            z: [0.2, 0.4, 0.2, 0.4]
          box_sizes:
            x: [0.8, 0.7, 0.8, 0.7]
            y: [0.6, 0.4, 0.6, 0.4]
            z: [0.1, 0.1, 0.1, 0.1]

        raycasting:
          # 是否开启光线投射构建局部地图。
          enable: true
          # 每批处理点云帧数，越大处理更批量但延迟更大。
          batch_update_size: 1
          # 光线投射有效距离区间 [min, max]，单位 m。
          ray_range: [0.03, 10.0]
          # 每次局部更新盒尺寸，控制增量地图更新覆盖范围。
          local_update_box: [10.0, 10.0, 2.5]
          # UNKNOWN 判断阈值相关参数，影响 FREE/UNKNOWN/OCCUPIED 判定。
          unk_thresh: 0.70
          p_hit: 0.9
          p_miss: 0.45
          p_min: 0.12
          p_max: 0.97
          p_occ: 0.85
          p_free: 0.499
          # 是否并行执行 raycast，可降低延迟但增加 CPU 占用。
          parallel_enable: false
          # raycast 线程数，不宜超过可用核数。
          num_threads: 4

        decay:
          # 是否开启障碍衰减逻辑，处理动态障碍残留。
          enable: true
          # 障碍在最后一次被观测后保留的最短时间，单位 s。
          keep_time: 0.5
          # 强制衰减回 free 的最长时间，单位 s，必须大于 keep_time。
          clear_time: 1.2
          # 是否只维护活跃 cell 列表以减少计算，开启通常更轻量。
          active_list_enable: false

        projection:
          enable: true

          # 标准 Nav2 YAML/PGM 静态先验地图，作为二维硬约束层。
          prior_map:
            enable: true
            # yaml_path: "src/navigation/navi2_bringup/maps/2026/rmuc2026_prior.yaml"
            yaml_path: "src/navigation/navi2_bringup/maps/2026/output.yaml"
            # 空字符串时使用 YAML 中的 image 字段进行解析。
            pgm_path: ""
            frame_id: map

          # ROGMap 中参与单柱扫描的绝对 Z 下界，单位 m。
          scan_z_min_abs: -0.20

          # ROGMap 中参与单柱扫描的绝对 Z 上界，单位 m。
          scan_z_max_abs: 1.5

          # UNKNOWN 是否视为 ESDF 障碍，影响探索和避障边界。
          unknown_as_occupied: false

          # 每个 XY 柱中 KNOWN_FREE + OCCUPIED 的最小观测体素数，低于此值不判定为有效信息。
          min_observed_voxels: 2

          # [vertical height difference, m]
          # 同一 XY 柱中最高与最低占据体素的垂直高度差 H。
          # 不超过该值时，分类为地面或坡面薄表面。
          # 这是差值，不是 ROGMap frame 中的绝对 Z 坐标。
          surface_height_delta_max: 0.25

          # [vertical height difference, m]
          # 判定竖直墙所需的最小单柱垂直高度差 H。
          # 这是差值，不是绝对 Z 坐标。
          wall_height_delta_min: 0.50

          # [dimensionless ratio, 0~1]
          # H 区间内的垂直占据率达到该值时，视为连续竖直墙。
          wall_occupancy_ratio_min: 0.80

          # [vertical height difference, m]
          # 可通行隧道所需的最小上下表面高度差。
          # 应包含机器人实际高度和安全余量。
          # 这是差值，不是绝对 Z 坐标。
          tunnel_height_delta_min: 0.26

          # [vertical height difference, m]
          # 当前 RM 场景中允许识别为目标隧道的最大上下表面高度差。
          # 这是差值，不是绝对 Z 坐标。
          tunnel_height_delta_max: 0.6

          # [dimensionless ratio, 0~1]
          # 隧道上下表面之间的最大垂直占据率。
          tunnel_occupancy_ratio_max: 0.6

          # PASSABLE 在 value layer 中的代价值。
          passable_cost: 50

          # PASSABLE 是否在 value layer 中写为 FREE。
          # PASSABLE 的 ESDF mask 始终为 1。
          passable_as_free: true

          hysteresis_enable: false
          hysteresis_count: 2
          # Projection 二维障碍退出原始 OCCUPIED 后的保持时间，单位为秒。
          obstacle_hold_time: 1.5

          mask_filter_en: true
          fill_occ_min: 8
          denoise_occ_max: 0
        field:
          enable: true
          inflation_radius: 0.0
          # [field][m] ESDF 正向最大截断距离；调大提供更远梯度但代价有限，过小会让远离障碍区域梯度变少。
          max_distance: 6.0
          # [field][m] ESDF 负向最小截断距离；控制障碍内部负距离下限，影响优化代价范围。
          min_distance: -3.0
          clamp_distance: true
          # [field][枚举] 插值方式 bilinear/quadratic；quadratic 梯度更平滑，边界邻域不足时会回退到 bilinear。
          interpolation: quadratic
          update_rate: 20.0

        performance:
          enable: false
          detailed_csv_enable: false
          summary_csv_enable: false
          detailed_csv_path: /tmp/rog_map_perf_detailed.csv
          summary_csv_path: /tmp/rog_map_perf_summary.csv
          run_id: ""
          # [performance][string] 实验场景名。
          scenario: ""
          # [performance][string] 实验变体名。
          variant: ""
          # [performance][行] CSV flush 间隔；避免每行强制 flush 变成新瓶颈，节点退出时仍会关闭文件。
          csv_flush_every_n: 30
          print_enable: true
          # [performance][Hz] 性能摘要和 summary CSV 频率。
          summary_rate: 1.0
          # [performance][bool] 是否启用 dirty column 增量刷新；开启可减少 projection/field 全量刷新计算量。
          dirty_column_enable: true
          # [performance][比例] dirty column 超过地图总列数比例时转全量刷新；调低更常全量，调高更依赖增量更新。
          dirty_full_ratio: 0.30
          # [performance/raycasting][bool] 并行 raycast 开关；代码后加载该值，会覆盖 raycasting.parallel_enable。
          parallel_raycast_enable: false
          raycast_num_threads: 4

        visualization:
          # [visualization][bool] 总开关；false 时不创建可视化 timer，不发布任何可视化 topic。
          enable: true
          frame_id: camera_init
          # [visualization][Hz] 可视化发布上限频率；实际每个 topic 仅在存在订阅者时构造并发布。
          rate: 10.0
          range: [10.0, 10.0, 1.5]
      corridor:
        robot_radius: 0.25
        extra_margin: 0.05

      smac_2d:
        use_esdf_cost: true
        esdf_weight: 1.0
        esdf_decay: 0.8
        esdf_max_cost: 0.5

      minco_optimizer:
        opt_freq: 20.0
        traj_goal_tolerance: 0.3
        enable_yaw_opt: true
        safe_dist: 0.35
        collision_dist: 0.2
        lookahead_dist: 6.0  # 前视距离,用于minco部分优化
        max_velocity: 3.0
        max_acceleration: 2.0
        max_yaw_dot: 5.0
        turn_angle_deadzone: 0.1
        turn_angle_saturation: 0.8
        min_turn_vel: 0.7
        decay_power: 1.6
        time_allocation_iters: 15
        smooth_eps: 0.01
        integral_res: 16
        opt_accuracy: 0.001
        print_optimizer_log: false
        penalty_weight_time: 100.0
        penalty_weight_pos: 50000.0
        penalty_weight_vel: 1500.0
        penalty_weight_acc: 1500.0
        penalty_weight_att: 100.0
        penalty_weight_time_barrier: 50.0
      recovery_server:
        fail_threshold: 5
        cooldown_sec: 1.0
        recovery_window_sec: 3.0
        escape_speed: 0.5
        # 同一目标在没有新提交轨迹的情况下允许的恢复次数（脱困或无脱困方向）；
        # 超过后 FSM 进入 FAILED，通过 /opt_path 通知控制器让 FollowPath 失败。
        max_attempts: 3

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
    # backup:
    #   # plugin: "nav2_behaviors/BackUp"
    #   plugin: "nav2_behaviors/BackUpTwzFree"
    #   local_costmap_global_frame: camera_init
    #   local_costmap_robot_base_frame: base_link_fake
    #   robot_radius: 0.3
    #   cost_threshold: 0.0
    #   visualization: true
    global_frame: map
    robot_base_frame: base_link_fake
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    enabled: False
    use_sim_time: False
    smoothing_frequency: 100.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [3.5, 3.5, 5.0]
    min_velocity: [-3.5, -3.5, -5.0]
    max_accel: [5.0, 5.0, 5.0]
    max_decel: [-5.0, -5.0, -5.0]
    odom_topic: "aft_mapped_to_init"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
