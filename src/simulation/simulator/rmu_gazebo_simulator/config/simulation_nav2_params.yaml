amcl:
  ros__parameters:
    # 使用 Gazebo 发布的 /clock，而不是系统墙钟。
    use_sim_time: True
    # AMCL 发布/使用的全局地图坐标系。
    global_frame_id: map
    # 里程计坐标系；仿真中由 Point-LIO 适配器发布。
    odom_frame_id: sim_odom
    # 机器人基座坐标系。
    base_frame_id: base_link
    # 禁止 AMCL 发布 map->odom，避免与仿真定位 TF 重复。
    tf_broadcast: false

bt_navigator:
  ros__parameters:
    # 行为树导航器使用仿真时钟。
    use_sim_time: True
    # 行为树导航器的全局规划坐标系。
    global_frame: map
    # 行为树导航器查询的机器人基座帧。
    robot_base_frame: "base_link"
    # 导航器使用的里程计话题。
    odom_topic: /odom
    # 行为树循环周期，单位毫秒。
    bt_loop_duration: 20 # ms
    # 行为树超时时间，秒
    default_server_timeout: 20
    # 毫秒
    wait_for_service_timeout: 2000
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    # Use Nav2 Jazzy's installed trees; the workspace trees target an older
    # plugin registration model and duplicate built-in node IDs.
    # Jazzy loads built-in BT plugins automatically; plugin_lib_names is only
    # for additional custom BehaviorTree.CPP node libraries.

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    # 控制器计算机器人位姿时使用的基座帧。
    robot_base_frame: "base_link"
    # 控制器使用仿真时钟。
    use_sim_time: True
    # 控制器输出频率，单位 Hz。
    controller_frequency: 20.0
    # 小于该值的 x 速度视为零，抑制数值噪声。
    min_x_velocity_threshold: 0.01
    # 小于该值的 y 速度视为零。
    min_y_velocity_threshold: 0.01
    # 小于该值的角速度视为零。
    min_theta_velocity_threshold: 0.001
    # 控制器允许的跟踪失败误差阈值，单位米。
    failure_tolerance: 0.1
    # 进度检查器参数块名称。
    progress_checker_plugin: "progress_checker"
    # 目标检查器参数块名称列表。
    goal_checker_plugins: ["general_goal_checker"]
    # 路径跟踪控制器参数块名称列表。
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      # 检查机器人是否在规定时间内移动了足够距离。
      plugin: "nav2_controller::SimpleProgressChecker"
      # 被认为有进展的最小位移，单位米。
      required_movement_radius: 0.1
      # 允许无进展的最长时间，单位秒。
      movement_time_allowance: 1000.0
    general_goal_checker:
      # 保留上次成功状态，避免目标附近反复切换。
      stateful: True
      # Nav2 的目标检查插件类型。
      plugin: "nav2_controller::SimpleGoalChecker"
      # 目标位置容差，单位米。
      xy_goal_tolerance: 0.1
      # 目标航向容差，单位弧度；6.28 表示基本不限制航向。
      yaw_goal_tolerance: 6.28

    FollowPath:
      # MINCO MPC 控制器插件类型。
      plugin: "minco_controller::MincoMpcController"
      # MPC sampling period (s) and lookahead time (s)
      # MPC 离散时间步长，单位秒。
      dt: 0.05
      # MPC 预测/跟踪前视时间，单位秒。
      lookahead_time : 0.5
      # 是否启用小陀螺模式（启用时使用 fixed_wz）。
      use_small_gyro_mode: true
      # 低于该速度时对控制量做死区处理，单位米/秒。
      deadzone_speed_threshold: 0.05
      # 对执行和通信延迟进行补偿的时间，单位秒。
      control_delay_compensation: 0.05

      # Cost weights: Q for state error [x, y, yaw], R for control error [vx, vy, omega]
      # 状态误差 [x, y, yaw] 的 MPC 权重。
      Q: [3.0, 3.0, 2.0]
      # 控制输入 [vx, vy, omega] 的 MPC 权重。
      R: [1.5, 1.5, 1.0]

      # Velocity bounds
      # x 方向最小速度，单位米/秒。
      vx_min: -3.0
      # x 方向最大速度，单位米/秒。
      vx_max: 3.0
      # y 方向最小速度，单位米/秒。
      vy_min: -3.0
      # y 方向最大速度，单位米/秒。
      vy_max: 3.0
      # 小陀螺模式下使用的固定角速度，单位弧度/秒。
      fixed_wz: 4.18 # rad/s, used if use_small_gyro_mode is true
      # 最小角速度，单位弧度/秒。
      omega_min: -5.0
      # 最大角速度，单位弧度/秒。
      omega_max: 5.0

      # Optional acceleration constraints
      # 是否在 MPC 中约束线加速度和角加速度。
      use_acc_constraints: true
      # x 方向最小加速度，单位米/秒^2。
      ax_min: -2.0
      # x 方向最大加速度，单位米/秒^2。
      ax_max: 2.0
      # y 方向最小加速度，单位米/秒^2。
      ay_min: -2.0
      # y 方向最大加速度，单位米/秒^2。
      ay_max: 2.0
      # 最小角加速度，单位弧度/秒^2。
      alpha_min: -5.0
      # 最大角加速度，单位弧度/秒^2。
      alpha_max: 5.0

      # Lidar extrinsic parameters
      # LiDAR 原点相对 base_link 的 x 杆臂，单位米。
      lidar_offset_x: 0.0
      # LiDAR 原点相对 base_link 的 y 杆臂，单位米。
      lidar_offset_y: 0.0
      # LiDAR 安装滚转补偿，单位弧度。
      lidar_roll_offset: 0.1745

      # Frame settings
      # 局部里程计坐标系名称。
      odom_frame: "sim_odom"
      # 全局地图坐标系名称。
      map_frame: "map"

      performance:
        # 是否启用 MPC 性能统计。
        enable: false
        # 是否向终端打印性能摘要。
        print_enable: false
        # 是否写入逐周期 CSV 明细。
        detailed_csv_enable: false
        # 是否打印里程计订阅调试信息。
        odom_sub_debug_enable: false
        # MPC 性能 CSV 输出路径。
        mpc_csv_path: /tmp/mpc_perf_detailed.csv
        # 性能摘要打印周期，单位秒。
        print_period_sec: 1.0
        # CSV 每写入多少行 flush 一次。
        csv_flush_every_n: 30
        # 性能运行标识，可用于区分实验批次。
        run_id: ""
        # 性能实验场景名称。
        scenario: ""
        # 性能实验变体名称。
        variant: ""


local_costmap:
  local_costmap:
    ros__parameters:
      # 局部代价地图更新频率，单位 Hz。
      update_frequency: 10.0
      # 局部代价地图发布频率，单位 Hz。
      publish_frequency: 10.0
      # 局部地图坐标系。
      global_frame: sim_odom
      # 机器人基座坐标系。
      robot_base_frame: base_link
      # 使用 Gazebo 仿真时钟。
      use_sim_time: True
      # 地图窗口是否跟随机器人移动。
      rolling_window: true
      # 局部窗口宽度，单位米。
      width: 5
      # 局部窗口高度，单位米。
      height: 5
      # 栅格分辨率，单位米/格。
      resolution: 0.05
      # robot_radius: 0.22
      # 机器人碰撞模型的等效半径，单位米。
      robot_radius: 0.3
      # 局部代价地图插件列表及加载顺序。
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      static_layer:
        # 静态地图插件类型。
        plugin: "nav2_costmap_2d::StaticLayer"
        # 使用瞬态本地 QoS 接收 map_server 的最近地图。
        map_subscribe_transient_local: True
      inflation_layer:
        # 障碍物膨胀插件类型。
        plugin: "nav2_costmap_2d::InflationLayer"
        # 代价随距离衰减的比例因子。
        cost_scaling_factor: 6.0
        # 障碍物外扩距离，单位米。
        inflation_radius: 0.25
      stvl_layer:
        # 时空体素层插件类型。
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        # 是否启用动态点云障碍层。
        enabled: true
        # 体素衰减时间，单位秒。
        voxel_decay: 0.6
        # 体素衰减模型编号。
        decay_model: 0
        # 三维体素边长，单位米。
        voxel_size: 0.05
        # 是否跟踪未观测体素为未知。
        track_unknown_space: true
        # 判定未知体素的观测阈值。
        unknown_threshold: 5
        # 障碍体素命中阈值。
        mark_threshold: 0
        # 是否根据机器人 footprint 更新清除区域。
        update_footprint_enabled: true
        # 动态层与主代价地图的合并方式。
        combination_method: 1
        # 体素地图 z 起点，单位米。
        origin_z: 0.0
        # 是否发布体素可视化地图。
        publish_voxel_map: true
        # 点云 TF 变换允许的时间误差，单位秒。
        transform_tolerance: 0.2
        # 是否将观测用于持续建图。
        mapping_mode: false
        # 地图保存最长时间，单位秒。
        map_save_duration: 60.0
        # 传感器观测源参数块名称。
        observation_sources: mid360
        mid360:
          # MID360 点云观测源配置。
          # 消息类型、话题、传感器帧和障碍标记/清除开关。
          data_type: PointCloud2
          topic: /simulation/cloud_registered_nav
          sensor_frame: front_mid360
          marking: true
          clearing: true
          obstacle_range: 8.0
          # The arena includes traversable surfaces around z=0.13 m. Keep
          # those floor returns out of the obstacle volume.
          min_obstacle_height: 0.3
          max_obstacle_height: 1.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true

          # 视锥模型参数，用于根据传感器的视锥体来更新STVL层的代价地图
          max_z: 10.0 # 清除距离
          # 参与清除的最小 z，单位米。
          min_z: 0.1
          vertical_fov_angle: 1.03   # default 0.7, radians. For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_offset: 0.3927  # default 0, radians. 3D Lidar only. Offset from planar axis. f.e. MID360 has a vFOV of -7deg to 52deg => offset +22.5deg (0.3927 rad)
          vertical_fov_padding: 0.05   # 3D Lidar only. Default 0, in meters
          horizontal_fov_angle: 6.29   # 3D lidar scanners like the VLP16 have 360 deg horizontal FOV.
          decay_acceleration: 15.0
          model_type: 1
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # 全局代价地图更新频率，单位 Hz。
      update_frequency: 10.0
      # 全局代价地图发布频率，单位 Hz。
      publish_frequency: 10.0
      # 全局地图坐标系。
      global_frame: map
      # 机器人基座坐标系。
      robot_base_frame: base_link
      # 使用 Gazebo 仿真时钟。
      use_sim_time: True
      # robot_radius: 0.22
      # 机器人碰撞模型的等效半径，单位米。
      robot_radius: 0.30
      # 全局栅格分辨率，单位米/格。
      resolution: 0.05
      # Keep unknown cells outside the static map in the master costmap.  The
      # STVL overlay below intentionally does not inject unknown values into
      # known-free static-prior cells when it has no current observation.
      # 是否保留静态地图之外的未知区域。
      track_unknown_space: true
      # 全局代价地图插件列表及加载顺序。
      plugins: ["static_layer", "stvl_layer", "inflation_layer"]
      # plugins: ["static_layer", "inflation_layer"]
      static_layer:
        # 静态地图插件类型。
        plugin: "nav2_costmap_2d::StaticLayer"
        # 使用瞬态本地 QoS 接收持久化地图。
        map_subscribe_transient_local: True
      inflation_layer:
        # 障碍物膨胀插件类型。
        plugin: "nav2_costmap_2d::InflationLayer"
        # 代价随距离衰减的比例因子。
        cost_scaling_factor: 6.0
        # 全局障碍物膨胀距离，单位米。
        inflation_radius: 0.80
      stvl_layer:
        # 时空体素层插件类型。
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        # 是否启用全局动态障碍层。
        enabled: true
        # 动态体素衰减时间，单位秒。
        voxel_decay: 1.5
        # 体素衰减模型编号。
        decay_model: 0
        # 三维体素边长，单位米。
        voxel_size: 0.05
        # Keep unknown semantics in the global master costmap, but leave
        # unobserved cells in this dynamic overlay free so the static prior is
        # not replaced by STVL's initial unknown volume.
        track_unknown_space: false
        # 判定未知体素的观测阈值。
        unknown_threshold: 5
        # 障碍体素命中阈值。
        mark_threshold: 0
        # 是否根据机器人 footprint 更新清除区域。
        update_footprint_enabled: true
        # 动态层与主代价地图的合并方式。
        combination_method: 1
        # 体素地图 z 起点，单位米。
        origin_z: 0.0
        # 是否发布体素可视化地图。
        publish_voxel_map: false
        # 点云 TF 变换允许的时间误差，单位秒。
        transform_tolerance: 0.2
        # 是否将观测用于持续建图。
        mapping_mode: false
        # 地图保存最长时间，单位秒。
        map_save_duration: 60.0
        # 传感器观测源参数块名称。
        observation_sources: mid360
        mid360:
          # 全局动态障碍使用的 MID360 点云观测源。
          data_type: PointCloud2
          topic: /simulation/cloud_registered_nav
          sensor_frame: front_mid360
          # The cloud is registered in sim_odom; retain the physical sensor
          # frame as the raytrace origin.
          marking: true
          clearing: true
          obstacle_range: 8.0
          # Match the local layer's floor cutoff so elevated traversable
          # surfaces cannot transiently block the global goal cell.
          min_obstacle_height: 0.3
          max_obstacle_height: 0.8
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true

          # 视锥模型参数，用于根据传感器的视锥体来更新STVL层的代价地图
          max_z: 10.0 # 清除距离
          # 参与清除的最小 z，单位米。
          min_z: 0.1
          vertical_fov_angle: 1.03   # default 0.7, radians. For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_offset: 0.3927  # default 0, radians. 3D Lidar only. Offset from planar axis. f.e. MID360 has a vFOV of -7deg to 52deg => offset +22.5deg (0.3927 rad)
          vertical_fov_padding: 0.05   # 3D Lidar only. Default 0, in meters
          horizontal_fov_angle: 6.29   # 3D lidar scanners like the VLP16 have 360 deg horizontal FOV.
          decay_acceleration: 15.0
          model_type: 1
      always_send_full_costmap: True

map_server:
  ros__parameters:
    # 地图服务器使用仿真时钟。
    use_sim_time: True
    # yaml_filename is injected by the Jazzy localization launch file. A
    # node-specific empty value here would override that launch parameter.

map_saver:
  ros__parameters:
    # 地图保存器使用仿真时钟。
    use_sim_time: True
    # 保存地图服务超时时间，单位秒。
    save_map_timeout: 5.0
    # 保存地图时低于该占用概率的栅格视为 free。
    free_thresh_default: 0.25
    # 保存地图时高于该占用概率的栅格视为 occupied。
    occupied_thresh_default: 0.65
    # 使用瞬态本地 QoS 订阅静态地图。
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # 期望的规划器调用频率，单位 Hz。
    expected_planner_frequency: 20.0
    # 规划器使用仿真时钟。
    use_sim_time: True
    # Jazzy's default navigation tree selects GridBased. Keep the Minco
    # implementation while exposing the planner under that standard id.
    # 规划器参数块名称列表。
    planner_plugins: ["GridBased"]

    GridBased:
      # MINCO 全局规划器插件类型。
      plugin: "minco_planner/MincoPlanner"
      # 规划模式：使用二维先验地图与在线 ROGMap。
      planner_mode: PRIORMAP
      # planner_mode: EXPLORATION
      frames:
        # Nav2 全局地图坐标系。
        map_frame: map
        # ROGMap 局部坐标系。
        rog_frame: sim_odom
      priormap:
        # 是否用 Nav2 全局搜索生成初始路径。
        use_nav2_global_search: true
        # 是否将搜索种子限制在 ROGMap 边界内。
        clip_seed_by_rog_boundary: true
        # ROGMap 边界安全余量，单位米。
        rog_boundary_margin: 0.2
        # 边界采样步长，单位米。
        rog_boundary_sample_step: 0.1
      exploration:
        # 探索边界安全余量，单位米。
        boundary_margin: 0.2
        # 探索边界采样步长，单位米。
        boundary_sample_step: 0.1
        # 是否把未知区域当作障碍。
        unknown_as_occupied: true
        # 是否优先沿目标方向扩展。
        prefer_goal_direction: true
      # 允许规划终点与目标的距离，单位米。
      tolerance: 0.3
      # 是否启用简化版 SMAC 二维搜索。
      use_smac: true
      # 是否允许路径穿过未知栅格。
      allow_unknown: false
      # 规划器订阅的里程计话题。
      odom_topic: /odom
      # LiDAR 相对 base_link 的 x 杆臂，单位米。
      lidar_offset_x: 0.0
      # LiDAR 相对 base_link 的 y 杆臂，单位米。
      lidar_offset_y: 0.0
      performance:
        enable: false
        print_enable: false
        detailed_csv_enable: false
        odom_sub_debug_enable: false
        minco_csv_path: /tmp/minco_perf_detailed.csv
        print_period_sec: 1.0
        csv_flush_every_n: 30
        run_id: ""
        scenario: ""
        variant: ""
      rog_map:
        # ROGMap 输出坐标系。
        frame_id: sim_odom
        # ROGMap 栅格分辨率，单位米/格。
        resolution: 0.05
        # [基础地图][m/cell] 三维膨胀地图分辨率；通常与 resolution 保持一致，过细增加膨胀查询计算量，过粗会让碰撞边界变粗糙。
        inflation_resolution: 0.05
        # 三维地图尺寸 [x, y, z]，单位米。
        map_size: [10.0, 10.0, 1.5]
        # 仿真点云已由 Point-LIO 做过体素降采样；再按时间抽样可避免
        # planner_server 内 ROGMap 更新追不上 10 Hz 点云输入。
        # Keep the validated simulation sampling profile; the latest-only
        # SensorData queue already drops superseded clouds under burst load.
        point_filt_num: 4
        # ROGMap 初始原点 [x, y, z]，单位米。
        fix_map_origin: [0.0, 0.0, 0.0]

        map_sliding:
          # 是否启用随机器人移动的滑动窗口。
          enable: true
          # [map_sliding][m] 触发地图滑动的位移阈值；过小会频繁滑动并带来计算抖动，过大可能让机器人靠近局部地图边缘。
          threshold: 0.2
          # 是否启用滑动窗口中心偏移。
          center_offset_enable: true
          # 地图中心相对机器人/里程计原点的偏移，单位米。
          center_offset: [0.0, 0.20, 0.0]

        ros_callback:
          # 是否启用 ROS 点云/里程计回调。
          enable: true
          # 输入点云话题。
          cloud_topic: /simulation/cloud_registered_full_nav
          # 输入里程计话题。
          odom_topic: /odom
          # 里程计超时时间，单位秒。
          odom_timeout: 2.0
          # 地图更新周期，单位毫秒。
          update_period_ms: 20

        # 入图前点云区域滤除；关闭时不创建过滤器，保持原始 ROGMap 数据链路。
        cloud_filter:
          # 是否启用入图前点云裁剪。
          enable: false
          # 点云 z 方向偏移，单位米。
          z_offset: -1.0
          # 裁剪框位置所使用的坐标系。
          position_frame: map
          filter_mode: transform_center   # transform_cloud | transform_center
          remove_inside: true             # true: 删除框内点，false: 仅保留框内点
          log_stats: false
          stats_log_period_ms: 1000        # 0: 每帧输出
          publish_visualization: true
          visualization_topic: /cloud_registered_crop_filter/markers
          visualization_period_ms: 200     # 0: 每帧发布
          z_plane_size: 10.0
          z_plane_thickness: 0.03
          box_padding: 0.1
          # positions.* 未配置或长度不一致时使用单框参数。
          position:
            x: 0.0
            y: 0.0
            z: 0.0
          box_size:
            x: 12.0
            y: 6.0
            z: 3.5
          positions:
            x: [15.6, 19.3, 13.4, 9.9]
            y: [1.55, 12.9, 13.45, 2.1]
            z: [0.2, 0.4, 0.2, 0.4]
          box_sizes:
            x: [0.8, 0.7, 0.8, 0.7]
            y: [0.6, 0.4, 0.6, 0.4]
            z: [0.1, 0.1, 0.1, 0.1]

        raycasting:
          # 是否启用射线清除/更新。
          enable: true
          # [raycasting][帧] 每批处理点云帧数；调大可攒批减少调度开销，但会增加地图更新延迟。
          batch_update_size: 1
          # [raycasting][m,m] 射线有效距离 [min,max]；min 过大会忽略近处点，max 过大会增加计算量并可能引入远处噪声。
          ray_range: [0.03, 10.0]
          # [raycasting][m,m,m] 每次局部更新盒尺寸；调大覆盖更多点但 raycasting 和 dirty column 数量上升。
          local_update_box: [8.0, 8.0, 2.0]
          # [raycasting][概率] unknown 判断阈值相关参数；影响 UNKNOWN/FREE/OCCUPIED 判定，进而影响 projection layer。
          unk_thresh: 0.70
          p_hit: 0.9
          p_miss: 0.45
          p_min: 0.12
          p_max: 0.97
          p_occ: 0.85
          p_free: 0.499
          # [raycasting/performance][bool] raycast 并行开关；会被 performance.parallel_raycast_enable 后加载覆盖，影响 CPU 占用和更新延迟。
          parallel_enable: true
          # [raycasting/performance][线程] 仿真 planner_server 与 Minco 共进程，保守使用 2 线程。
          num_threads: 2

        decay:
          # 是否启用 ROGMap 障碍衰减。
          enable: true
          # [decay][s] 最后一次 hit 后保持 occupied 的最小时间；过短障碍闪烁，过长动态障碍残留。
          keep_time: 0.5
          # [decay][s] 最后一次 hit 后强制衰减到 free 的最大时间；必须大于 keep_time。
          clear_time: 1.2
          # [decay][bool] 只维护活跃 cell 衰减列表；开启通常降低计算量，若列表维护异常会影响动态清除完整性。
          active_list_enable: false

        projection:
          # 是否启用三维 ROGMap 到二维代价的投影。
          enable: true

          # 标准 Nav2 YAML/PGM 静态先验；启用后只增加二维硬障碍，不清除在线障碍。
          prior_map:
            # 是否叠加静态二维先验地图。
            enable: true
            # 先验地图 YAML 路径。
            yaml_path: "src/simulation/simulator/rmu_gazebo_simulator/maps/rmuc_2025.yaml"
            # 留空时使用 YAML 的 image 字段，并相对 YAML 所在目录解析。
            pgm_path: ""
            # 先验地图坐标系。
            frame_id: map

          # [absolute Z coordinate, m]
          # ROGMap frame 中参与单柱扫描的绝对 Z 下界。
          # 这是坐标值，不是地面相对高度，也不是高度差。
          scan_z_min_abs: -0.20

          # [absolute Z coordinate, m]
          # ROGMap frame 中参与单柱扫描的绝对 Z 上界。
          # 这是坐标值，不是障碍高度，也不是高度差。
          scan_z_max_abs: 1.5

          # UNKNOWN 是否作为 ESDF 障碍。
          # 是否把未知柱体当成障碍。
          unknown_as_occupied: false

          # 每个 XY 柱中 KNOWN_FREE + OCCUPIED 的最小观测体素数。
          # 每个二维柱所需的最少观测体素数。
          min_observed_voxels: 2

          # [vertical height difference, m]
          # 同一 XY 柱中最高与最低占据体素的垂直高度差 H。
          # 不超过该值时，分类为地面或坡面薄表面。
          # 这是差值，不是 ROGMap frame 中的绝对 Z 坐标。
          surface_height_delta_max: 0.25

          # [vertical height difference, m]
          # 判定竖直墙所需的最小单柱垂直高度差 H。
          # 这是差值，不是绝对 Z 坐标。
          wall_height_delta_min: 0.50

          # [dimensionless ratio, 0~1]
          # H 区间内的垂直占据率达到该值时，视为连续竖直墙。
          wall_occupancy_ratio_min: 0.80

          # [vertical height difference, m]
          # 可通行隧道所需的最小上下表面高度差。
          # 应包含机器人实际高度和安全余量。
          # 这是差值，不是绝对 Z 坐标。
          tunnel_height_delta_min: 0.26

          # [vertical height difference, m]
          # 当前 RM 场景中允许识别为目标隧道的最大上下表面高度差。
          # 这是差值，不是绝对 Z 坐标。
          tunnel_height_delta_max: 0.6

          # [dimensionless ratio, 0~1]
          # 隧道上下表面之间的最大垂直占据率。
          tunnel_occupancy_ratio_max: 0.6

          # PASSABLE 在 value layer 中的代价值。
          passable_cost: 50

          # PASSABLE 是否在 value layer 中写为 FREE。
          # PASSABLE 的 ESDF mask 始终为 1。
          passable_as_free: true

          # 是否启用投影结果的滞回。
          hysteresis_enable: false
          # 连续满足条件多少次后改变状态。
          hysteresis_count: 2
          # Projection 二维障碍退出原始 OCCUPIED 后的保持时间，单位为秒。
          obstacle_hold_time: 1.5

          # 是否启用占据掩码滤波。
          mask_filter_en: true
          # 填充占据区域的最小数量阈值。
          fill_occ_min: 8
          # 去噪时允许删除的最大占据数量。
          denoise_occ_max: 0
        field:
          # 是否计算 ESDF 场。
          enable: true
          # ESDF 额外膨胀距离，单位米。
          inflation_radius: 0.0
          # [field][m] ESDF 正向最大截断距离；调大提供更远梯度但代价有限，过小会让远离障碍区域梯度变少。
          max_distance: 6.0
          # [field][m] ESDF 负向最小截断距离；控制障碍内部负距离下限，影响优化代价范围。
          min_distance: -3.0
          clamp_distance: true
          # [field][枚举] 插值方式 bilinear/quadratic；quadratic 梯度更平滑，边界邻域不足时会回退到 bilinear。
          interpolation: bilinear
          # ESDF 更新频率，单位 Hz。
          update_rate: 20.0

        performance:
          # 是否启用 ROGMap 性能统计总开关。
          enable: false
          # 是否记录逐帧明细 CSV。
          detailed_csv_enable: false
          # 是否记录汇总 CSV。
          summary_csv_enable: false
          detailed_csv_path: /tmp/rog_map_perf_detailed.csv
          summary_csv_path: /tmp/rog_map_perf_summary.csv
          run_id: ""
          # [performance][string] 实验场景名。
          scenario: ""
          # [performance][string] 实验变体名。
          variant: ""
          # [performance][行] CSV flush 间隔；避免每行强制 flush 变成新瓶颈，节点退出时仍会关闭文件。
          csv_flush_every_n: 30
          print_enable: true
          # [performance][Hz] 性能摘要和 summary CSV 频率。
          summary_rate: 1.0
          # [performance][bool] 是否启用 dirty column 增量刷新；开启可减少 projection/field 全量刷新计算量。
          dirty_column_enable: true
          # [performance][比例] dirty column 超过地图总列数比例时转全量刷新；调低更常全量，调高更依赖增量更新。
          dirty_full_ratio: 0.30
          # [performance/raycasting][bool] 并行 raycast 开关；代码后加载该值，会覆盖 raycasting.parallel_enable。
          parallel_raycast_enable: true
          raycast_num_threads: 2

        visualization:
          # [visualization][bool] 总开关；false 时不创建可视化 timer，不发布任何可视化 topic。
          enable: true
          # ROGMap 可视化坐标系。
          frame_id: sim_odom
          # [visualization][Hz] 可视化发布上限频率；实际每个 topic 仅在存在订阅者时构造并发布。
          rate: 2.0
          # 可视化覆盖范围 [x,y,z]，单位米。
          range: [10.0, 10.0, 1.5]
      corridor:
        # 走廊生成器使用的机器人等效半径，单位米。
        robot_radius: 0.35
        # 走廊额外安全边界，单位米。
        extra_margin: 0.08

      smac_2d:
        # 是否在 SMAC 代价中使用 ESDF。
        use_esdf_cost: true
        # ESDF 代价权重。
        esdf_weight: 1.0
        # ESDF 代价衰减系数。
        esdf_decay: 0.8
        # ESDF 代价上限。
        esdf_max_cost: 0.5

      minco_optimizer:
        # MINCO 轨迹优化频率，单位 Hz。
        opt_freq: 25.0
        # 轨迹终点位置容差，单位米。
        traj_goal_tolerance: 0.15
        # 是否同时优化航向轨迹。
        enable_yaw_opt: true
        safe_dist: 0.4
        collision_dist: 0.25
        # 优化器前视距离，单位米。
        lookahead_dist: 6.5  # 前视距离,用于minco部分优化
        # 轨迹最大速度，单位米/秒。
        max_velocity: 3.0
        # 轨迹最大加速度，单位米/秒^2。
        max_acceleration: 2.0
        # 最大航向角速度，单位弧度/秒。
        max_yaw_dot: 5.0
        # 小转角死区，单位弧度。
        turn_angle_deadzone: 0.1
        # 转角饱和值，单位弧度。
        turn_angle_saturation: 0.8
        # 转弯时的最小线速度，单位米/秒。
        min_turn_vel: 0.7
        # 代价衰减幂指数。
        decay_power: 1.6
        # 时间分配迭代次数。
        time_allocation_iters: 15
        # 数值平滑项，避免梯度奇异。
        smooth_eps: 0.01
        # 碰撞积分采样分辨率。
        integral_res: 16
        # 优化收敛精度。
        opt_accuracy: 0.001
        # 是否打印优化器内部日志。
        print_optimizer_log: false
        penalty_weight_time: 100.0
        penalty_weight_pos: 50000.0
        penalty_weight_vel: 1500.0
        penalty_weight_acc: 1500.0
        penalty_weight_att: 100.0
        penalty_weight_time_barrier: 50.0
      recovery_server:
        # 连续失败多少次后触发恢复。
        fail_threshold: 5
        # 两次恢复之间的冷却时间，单位秒。
        cooldown_sec: 1.0
        # 恢复行为的最长窗口，单位秒。
        recovery_window_sec: 3.0
        # 脱困速度，单位米/秒。
        escape_speed: 0.5

smoother_server:
  ros__parameters:
    # 平滑器使用仿真时钟。
    use_sim_time: True
    # 平滑器插件参数块名称。
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      # Nav2 简单路径平滑器插件类型。
      plugin: "nav2_smoother::SimpleSmoother"
      # 平滑迭代停止的最大误差。
      tolerance: 1.0e-10
      # 最大平滑迭代次数。
      max_its: 1000
      # 是否执行额外的路径细化。
      do_refinement: True

behavior_server:
  ros__parameters:
    # 行为服务器读取的局部代价地图话题。
    costmap_topic: local_costmap/costmap_raw
    # 行为服务器读取的机器人 footprint 话题。
    footprint_topic: local_costmap/published_footprint
    # 行为插件执行频率，单位 Hz。
    cycle_frequency: 10.0
    # 启用的恢复行为列表。
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      # 原地旋转行为插件。
      plugin: "nav2_behaviors::Spin"
    backup:
      # 倒车行为插件。
      plugin: "nav2_behaviors::BackUp"
    wait:
      # 等待行为插件。
      plugin: "nav2_behaviors::Wait"
    # 行为服务器全局坐标系。
    global_frame: map
    # 行为服务器局部坐标系。
    local_frame: sim_odom
    # 机器人基座坐标系。
    robot_base_frame: base_link
    # TF 查询允许的时间误差，单位秒。
    transform_tolerance: 0.1
    # 使用仿真时钟。
    use_sim_time: True
    # 行为仿真向前积分时间，单位秒。
    simulate_ahead_time: 2.0
    # 最大原地旋转速度，单位弧度/秒。
    max_rotational_vel: 1.0
    # 最小原地旋转速度，单位弧度/秒。
    min_rotational_vel: 0.4
    # 原地旋转最大角加速度，单位弧度/秒^2。
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    # 使用仿真时钟发布机器人 TF。
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    # 航点跟随器使用仿真时钟。
    use_sim_time: True
    # 航点任务循环频率，单位 Hz。
    loop_rate: 20
    # 单个航点失败时是否停止整个任务。
    stop_on_failure: false
    # 航点任务执行器参数块名称。
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      # 航点等待插件类型。
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      # 是否启用航点等待。
      enabled: True
      # 每个航点暂停时间，单位毫秒。
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    # 速度平滑器使用仿真时钟。
    use_sim_time: True
    # 平滑器输出频率，单位 Hz。
    smoothing_frequency: 100.0
    # 是否按各轴比例缩放速度。
    scale_velocities: False
    # 速度反馈模式；OPEN_LOOP 不依赖实际速度闭环。
    feedback: "OPEN_LOOP"
    # 各轴最大速度 [vx, vy, wz]，单位米/秒、弧度/秒。
    max_velocity: [3.5, 3.5, 5.0]
    # 各轴最小速度 [vx, vy, wz]。
    min_velocity: [-3.5, -3.5, -5.0]
    # 各轴最大加速度，单位米/秒^2、弧度/秒^2。
    max_accel: [5.0, 5.0, 5.0]
    # 各轴最大减速度，通常使用负值。
    max_decel: [-5.0, -5.0, -5.0]
    # 闭环模式使用的里程计话题。
    odom_topic: "/odom"
    # 里程计速度有效时间，单位秒。
    odom_duration: 0.1
    # 速度死区 [vx, vy, wz]，单位米/秒、弧度/秒。
    deadband_velocity: [0.0, 0.0, 0.0]
    # 超过该时间没有新命令就停止，单位秒。
    velocity_timeout: 0.2
